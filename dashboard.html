<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Absensi</title>
<style>
  body { font-family: Arial; margin: 0; padding: 20px; background: #f4f4f4; }
  h2 { color: #333; }
  .tabs { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
  .tab-btn { padding: 10px 14px; border: none; border-radius: 6px; background: #ddd; cursor: pointer; }
  .tab-btn.active { background: #4285F4; color: white; }
  .panel { display: none; background: white; padding: 15px; border-radius: 8px; overflow-x: auto; }
  .panel.active { display: block; }
  input, button.aksi { padding: 8px; margin: 5px 0; border-radius: 4px; border: 1px solid #ccc; font-size: 15px; }
  button.aksi { background: #34A853; color: white; border: none; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; font-size: 14px; }
  th { background: #eee; }
  .hadir { color: green; font-weight: bold; }
  .tidak { color: red; font-weight: bold; }
  #lockScreen { text-align: center; margin-top: 100px; }
</style>
</head>
<body>

<div id="lockScreen">
  <h2>🔒 Dashboard Absensi</h2>
  <input type="password" id="pwInput" placeholder="smpn1056789">
  <br><button class="aksi" onclick="cekPassword()">Masuk</button>
  <p id="pwError" style="color:red;"></p>
</div>

<div id="dashboardContent" style="display:none;">
  <h2>📊 Dashboard Absensi Sekolah</h2>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('absHarian', this)">Absensi Harian</button>
    <button class="tab-btn" onclick="showTab('absBulanan', this)">Absensi Bulanan</button>
    <button class="tab-btn" onclick="showTab('kbmHarian', this)">KBM Harian</button>
    <button class="tab-btn" onclick="showTab('kbmBulanan', this)">KBM Bulanan</button>
  </div>

  <div id="absHarian" class="panel active">
    <label>Tanggal: </label>
    <input type="date" id="tglAbsHarian">
    <button class="aksi" onclick="loadAbsensiHarian()">Tampilkan</button>
    <div id="hasilAbsHarian"></div>
  </div>

  <div id="absBulanan" class="panel">
    <label>Bulan: </label>
    <input type="month" id="bulanAbsBulanan">
    <button class="aksi" onclick="loadAbsensiBulanan()">Tampilkan</button>
    <div id="hasilAbsBulanan"></div>
  </div>

  <div id="kbmHarian" class="panel">
    <label>Tanggal: </label>
    <input type="date" id="tglKbmHarian">
    <button class="aksi" onclick="loadKBMHarian()">Tampilkan</button>
    <div id="hasilKbmHarian"></div>
  </div>

  <div id="kbmBulanan" class="panel">
    <label>Bulan: </label>
    <input type="month" id="bulanKbmBulanan">
    <button class="aksi" onclick="loadKBMBulanan()">Tampilkan</button>
    <div id="hasilKbmBulanan"></div>
  </div>
</div>

<script>
  const PASSWORD = "GANTI_PASSWORD_KAMU";
  const URL_EXEC = "https://script.google.com/macros/s/AKfycbxClgr-Qn0BD6sQppzv_Cmc7GO9XG__dF7SF17NMH9wvdS44qS43PNLysaAA1eIYf_Y/exec";

  // Isi awal: hari ini dan bulan ini
  (function isiDefault() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    document.getElementById('tglAbsHarian').value = `${y}-${m}-${d}`;
    document.getElementById('tglKbmHarian').value = `${y}-${m}-${d}`;
    document.getElementById('bulanAbsBulanan').value = `${y}-${m}`;
    document.getElementById('bulanKbmBulanan').value = `${y}-${m}`;
  })();

  // Ubah 2026-10-15 menjadi 15/10/2026
  function ubahTanggal(v) {
    const [y, m, d] = v.split('-');
    return `${d}/${m}/${y}`;
  }

  // Ubah 2026-10 menjadi { bulan: 10, tahun: 2026 }
  function ubahBulan(v) {
    const [y, m] = v.split('-');
    return { bulan: parseInt(m), tahun: parseInt(y) };
  }

  function cekPassword() {
    const input = document.getElementById('pwInput').value;
    if (input === PASSWORD) {
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('dashboardContent').style.display = 'block';
    } else {
      document.getElementById('pwError').innerText = 'Password salah!';
    }
  }

  function showTab(id, tombol) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    tombol.classList.add('active');
  }

  function tampilError(idElemen, pesan) {
    document.getElementById(idElemen).innerHTML = '<p style="color:red;">' + pesan + '</p>';
  }

  function loadAbsensiHarian() {
    const v = document.getElementById('tglAbsHarian').value;
    if (!v) { tampilError('hasilAbsHarian', 'Pilih tanggal dulu.'); return; }
    document.getElementById('hasilAbsHarian').innerHTML = 'Memuat...';
    fetch(`${URL_EXEC}?action=absensiHarian&tanggal=${ubahTanggal(v)}`)
      .then(r => r.json())
      .then(res => {
        if (res.error) { tampilError('hasilAbsHarian', 'Error: ' + res.error); return; }
        let html = '<table><tr><th>Nama</th><th>Status</th><th>Jam</th></tr>';
        res.data.forEach(g => {
          html += `<tr><td>${g.nama}</td><td class="${g.status==='Hadir'?'hadir':'tidak'}">${g.status}</td><td>${g.jam}</td></tr>`;
        });
        html += '</table>';
        document.getElementById('hasilAbsHarian').innerHTML = html;
      })
      .catch(err => tampilError('hasilAbsHarian', 'Gagal memuat: ' + err));
  }

  function loadAbsensiBulanan() {
    const v = document.getElementById('bulanAbsBulanan').value;
    if (!v) { tampilError('hasilAbsBulanan', 'Pilih bulan dulu.'); return; }
    const { bulan, tahun } = ubahBulan(v);
    document.getElementById('hasilAbsBulanan').innerHTML = 'Memuat...';
    fetch(`${URL_EXEC}?action=absensiBulanan&bulan=${bulan}&tahun=${tahun}`)
      .then(r => r.json())
      .then(res => {
        if (res.error) { tampilError('hasilAbsBulanan', 'Error: ' + res.error); return; }
        let html = '<table><tr><th>Nama</th><th>Hadir</th><th>Total Hari Kerja</th><th>Persentase</th></tr>';
        res.data.forEach(g => {
          html += `<tr><td>${g.nama}</td><td>${g.hadir}</td><td>${g.totalHariKerja}</td><td>${g.persen}%</td></tr>`;
        });
        html += '</table>';
        document.getElementById('hasilAbsBulanan').innerHTML = html;
      })
      .catch(err => tampilError('hasilAbsBulanan', 'Gagal memuat: ' + err));
  }

  function loadKBMHarian() {
    const v = document.getElementById('tglKbmHarian').value;
    if (!v) { tampilError('hasilKbmHarian', 'Pilih tanggal dulu.'); return; }
    document.getElementById('hasilKbmHarian').innerHTML = 'Memuat...';
    fetch(`${URL_EXEC}?action=kbmHarian&tanggal=${ubahTanggal(v)}`)
      .then(r => r.json())
      .then(res => {
        if (res.error) { tampilError('hasilKbmHarian', 'Error: ' + res.error); return; }
        let html = '<table><tr><th>Kelas</th><th>Mapel</th><th>Guru</th><th>Status</th><th>Keterangan</th></tr>';
        res.data.forEach(g => {
          const st = g.status.toString().toUpperCase().includes('TIDAK') ? 'tidak' : 'hadir';
          html += `<tr><td>${g.kelas}</td><td>${g.mapel}</td><td>${g.guru}</td><td class="${st}">${g.status}</td><td>${g.keterangan||''}</td></tr>`;
        });
        html += '</table>';
        document.getElementById('hasilKbmHarian').innerHTML = html;
      })
      .catch(err => tampilError('hasilKbmHarian', 'Gagal memuat: ' + err));
  }

  function loadKBMBulanan() {
    const v = document.getElementById('bulanKbmBulanan').value;
    if (!v) { tampilError('hasilKbmBulanan', 'Pilih bulan dulu.'); return; }
    const { bulan, tahun } = ubahBulan(v);
    document.getElementById('hasilKbmBulanan').innerHTML = 'Memuat...';
    fetch(`${URL_EXEC}?action=kbmBulanan&bulan=${bulan}&tahun=${tahun}`)
      .then(r => r.json())
      .then(res => {
        if (res.error) { tampilError('hasilKbmBulanan', 'Error: ' + res.error); return; }
        let html = '<table><tr><th>Nama Guru</th><th>Total Tercatat</th><th>Hadir</th><th>Tidak Hadir</th><th>Persentase</th></tr>';
        res.data.forEach(g => {
          html += `<tr><td>${g.nama}</td><td>${g.total}</td><td>${g.hadir}</td><td>${g.tidakHadir}</td><td>${g.persen}%</td></tr>`;
        });
        html += '</table>';
        document.getElementById('hasilKbmBulanan').innerHTML = html;
      })
      .catch(err => tampilError('hasilKbmBulanan', 'Gagal memuat: ' + err));
  }
</script>
</body>
</html>
