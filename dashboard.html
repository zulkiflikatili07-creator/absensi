<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Absensi</title>
<style>
  body { font-family: Arial; margin: 0; padding: 20px; background: #f4f4f4; }
  h2 { color: #333; }
  .tabs { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
  .tab-btn { padding: 10px 14px; border: none; border-radius: 6px; background: #ddd; cursor: pointer; }
  .tab-btn.active { background: #4285F4; color: white; }
  .panel { display: none; background: white; padding: 15px; border-radius: 8px; }
  .panel.active { display: block; }
  input, button.aksi { padding: 8px; margin: 5px 0; border-radius: 4px; border: 1px solid #ccc; }
  button.aksi { background: #34A853; color: white; border: none; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; font-size: 14px; }
  th { background: #eee; }
  .hadir { color: green; font-weight: bold; }
  .tidak { color: red; font-weight: bold; }
  #lockScreen { text-align: center; margin-top: 100px; }
</style>
</head>
<body>

<div id="lockScreen">
  <h2>🔒 Dashboard Absensi</h2>
  <input type="password" id="pwInput" placeholder="Masukkan password">
  <br><button class="aksi" onclick="cekPassword()">Masuk</button>
  <p id="pwError" style="color:red;"></p>
</div>

<div id="dashboardContent" style="display:none;">
  <h2>📊 Dashboard Absensi Sekolah</h2>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('absHarian')">Absensi Harian</button>
    <button class="tab-btn" onclick="showTab('absBulanan')">Absensi Bulanan</button>
    <button class="tab-btn" onclick="showTab('kbmHarian')">KBM Harian</button>
    <button class="tab-btn" onclick="showTab('kbmBulanan')">KBM Bulanan</button>
  </div>

  <div id="absHarian" class="panel active">
    <label>Tanggal (DD/MM/YYYY): </label>
    <input type="text" id="tglAbsHarian" placeholder="16/09/2026">
    <button class="aksi" onclick="loadAbsensiHarian()">Tampilkan</button>
    <div id="hasilAbsHarian"></div>
  </div>

  <div id="absBulanan" class="panel">
    <label>Bulan (1-12): </label><input type="number" id="bulanAbsBulanan" min="1" max="12" style="width:60px">
    <label>Tahun: </label><input type="number" id="tahunAbsBulanan" style="width:80px">
    <button class="aksi" onclick="loadAbsensiBulanan()">Tampilkan</button>
    <div id="hasilAbsBulanan"></div>
  </div>

  <div id="kbmHarian" class="panel">
    <label>Tanggal (DD/MM/YYYY): </label>
    <input type="text" id="tglKbmHarian" placeholder="16/09/2026">
    <button class="aksi" onclick="loadKBMHarian()">Tampilkan</button>
    <div id="hasilKbmHarian"></div>
  </div>

  <div id="kbmBulanan" class="panel">
    <label>Bulan (1-12): </label><input type="number" id="bulanKbmBulanan" min="1" max="12" style="width:60px">
    <label>Tahun: </label><input type="number" id="tahunKbmBulanan" style="width:80px">
    <button class="aksi" onclick="loadKBMBulanan()">Tampilkan</button>
    <div id="hasilKbmBulanan"></div>
  </div>
</div>

<script>
  const PASSWORD = "smpn10toili56789";
  const URL_EXEC = "https://script.google.com/macros/s/AKfycbxClgr-Qn0BD6sQppzv_Cmc7GO9XG__dF7SF17NMH9wvdS44qS43PNLysaAA1eIYf_Y/exec";

  function cekPassword() {
    const input = document.getElementById('pwInput').value;
    if (input === PASSWORD) {
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('dashboardContent').style.display = 'block';
    } else {
      document.getElementById('pwError').innerText = 'Password salah!';
    }
  }

  function showTab(id) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.target.classList.add('active');
  }

  function loadAbsensiHarian() {
    const tgl = document.getElementById('tglAbsHarian').value;
    document.getElementById('hasilAbsHarian').innerHTML = 'Memuat...';
    fetch(`${URL_EXEC}?action=absensiHarian&tanggal=${tgl}`)
      .then(r => r.json())
      .then(res => {
        if (res.error) { document.getElementById('hasilAbsHarian').innerHTML = 'Error: ' + res.error; return; }
        let html = '<table><tr><th>Nama</th><th>Status</th><th>Jam</th></tr>';
        res.data.forEach(g => {
          html += `<tr><td>${g.nama}</td><td class="${g.status==='Hadir'?'hadir':'tidak'}">${g.status}</td><td>${g.jam}</td></tr>`;
        });
        html += '</table>';
        document.getElementById('hasilAbsHarian').innerHTML = html;
      });
  }

  function loadAbsensiBulanan() {
    const bulan = document.getElementById('bulanAbsBulanan').value;
    const tahun = document.getElementById('tahunAbsBulanan').value;
    document.getElementById('hasilAbsBulanan').innerHTML = 'Memuat...';
    fetch(`${URL_EXEC}?action=absensiBulanan&bulan=${bulan}&tahun=${tahun}`)
      .then(r => r.json())
      .then(res => {
        if (res.error) { document.getElementById('hasilAbsBulanan').innerHTML = 'Error: ' + res.error; return; }
        let html = '<table><tr><th>Nama</th><th>Hadir</th><th>Total Hari Kerja</th><th>Persentase</th></tr>';
        res.data.forEach(g => {
          html += `<tr><td>${g.nama}</td><td>${g.hadir}</td><td>${g.totalHariKerja}</td><td>${g.persen}%</td></tr>`;
        });
        html += '</table>';
        document.getElementById('hasilAbsBulanan').innerHTML = html;
      });
  }

  function loadKBMHarian() {
    const tgl = document.getElementById('tglKbmHarian').value;
    document.getElementById('hasilKbmHarian').innerHTML = 'Memuat...';
    fetch(`${URL_EXEC}?action=kbmHarian&tanggal=${tgl}`)
      .then(r => r.json())
      .then(res => {
        if (res.error) { document.getElementById('hasilKbmHarian').innerHTML = 'Error: ' + res.error; return; }
        let html = '<table><tr><th>Kelas</th><th>Mapel</th><th>Guru</th><th>Status</th><th>Keterangan</th></tr>';
        res.data.forEach(g => {
          const st = g.status.toString().toUpperCase().includes('TIDAK') ? 'tidak' : 'hadir';
          html += `<tr><td>${g.kelas}</td><td>${g.mapel}</td><td>${g.guru}</td><td class="${st}">${g.status}</td><td>${g.keterangan||''}</td></tr>`;
        });
        html += '</table>';
        document.getElementById('hasilKbmHarian').innerHTML = html;
      });
  }

  function loadKBMBulanan() {
    const bulan = document.getElementById('bulanKbmBulanan').value;
    const tahun = document.getElementById('tahunKbmBulanan').value;
    document.getElementById('hasilKbmBulanan').innerHTML = 'Memuat...';
    fetch(`${URL_EXEC}?action=kbmBulanan&bulan=${bulan}&tahun=${tahun}`)
      .then(r => r.json())
      .then(res => {
        if (res.error) { document.getElementById('hasilKbmBulanan').innerHTML = 'Error: ' + res.error; return; }
        let html = '<table><tr><th>Nama Guru</th><th>Total Tercatat</th><th>Hadir</th><th>Tidak Hadir</th><th>Persentase</th></tr>';
        res.data.forEach(g => {
          html += `<tr><td>${g.nama}</td><td>${g.total}</td><td>${g.hadir}</td><td>${g.tidakHadir}</td><td>${g.persen}%</td></tr>`;
        });
        html += '</table>';
        document.getElementById('hasilKbmBulanan').innerHTML = html;
      });
  }
</script>
</body>
</html>
