<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {font-family: Arial; text-align: center; padding: 20px;}
    #reader {width: 100%; max-width: 400px; margin: 20px auto;}
    #status {font-size: 18px; margin: 20px;}
  </style>
</head>
<body>
  <h2>Absensi Guru - Scan QR Code</h2>
  <div id="reader"></div>
  <div id="status">Arahkan kamera ke QR Code</div>
  <script>
    const URL_EXEC = "https://script.google.com/macros/s/AKfycbxClgr-Qn0BD6sQppzv_Cmc7GO9XG__dF7SF17NMH9wvdS44qS43PNLysaAA1eIYf_Y/exec"; //

    const html5QrCode = new Html5Qrcode("reader");

    function onScanSuccess(decodedText) {
      const nama = decodedText.trim();
      document.getElementById('status').innerHTML = "Mengecek lokasi...";

      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        const sekolahLat = -1.456100664473237; //
        const sekolahLng = 122.3611767937154; //
        const radius = 100;

        const jarak = hitungJarak(lat, lng, sekolahLat, sekolahLng);

        if (jarak <= radius) {
          fetch(`${URL_EXEC}?nama=${encodeURIComponent(nama)}&lat=${lat}&lng=${lng}`)
            .then(res => res.text())
            .then(msg => {
              document.getElementById('status').innerHTML = `<span style="color:green">${msg}</span>`;
            })
            .catch(err => {
              document.getElementById('status').innerHTML = `<span style="color:red">Gagal kirim: ${err}</span>`;
            });
        } else {
          document.getElementById('status').innerHTML = `<span style="color:red">❌ Di luar area! Jarak ${jarak.toFixed(0)}m</span>`;
        }
      });
    }

    function hitungJarak(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    html5QrCode.start({facingMode: "environment"}, {fps: 10, qrbox: 280}, onScanSuccess);
  </script>
</body>
</html>
